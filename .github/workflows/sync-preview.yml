run: |
  git config --global user.name "github-actions"
  git config --global user.email "github-actions@github.com"

  git clone https://x-access-token:${{ secrets.PREVIEW_TOKEN }}@github.com/<TON_COMPTE>/pbc-preview.git preview-repo

  rsync -av --delete \
    --exclude='.git' \
    --exclude='.github' \
    --exclude='preview-repo' \
    ./ preview-repo/

  cd preview-repo

  git add .

  if ! git diff --cached --quiet; then
    git commit -m "Update preview from pbc"
    git push origin main
  fi
