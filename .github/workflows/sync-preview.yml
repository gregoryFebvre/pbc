name: Sync Preview Repository

on:
  push:
    branches:
      - preview

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Push to preview repository
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git clone https://x-access-token:${{ secrets.PREVIEW_TOKEN }}@github.com/gregoryFebvre/pbc-preview.git preview-repo

          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            ./ preview-repo/

          cd preview-repo

          git add .

          git diff --staged --quiet || git commit -m "Update preview from pbc"

          git push origin main
